name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release for the version in Cargo.toml (main only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Unit and API tests
        run: cargo test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest playwright
      - run: python -m playwright install --with-deps chromium
      - name: ffmpeg (makes a test video)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Browser tests
        run: python -m pytest tests/e2e -v

  windows:
    needs: [test, e2e]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Clips live in voice/ in the repo; this only fills in any that are missing.
      - name: Generate missing Thai voice clips (edge-tts)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        run: |
          pip install "edge-tts>=6.1,<8"
          python tools/make_voice.py

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/SHPH-Queue/voice | Out-Null
          Copy-Item target/release/shph-queue.exe dist/SHPH-Queue/
          Copy-Item packaging/*.bat dist/SHPH-Queue/
          Copy-Item packaging/README-Windows.txt dist/SHPH-Queue/
          Copy-Item voice/voice_lines.json dist/SHPH-Queue/voice/
          Copy-Item voice/*.mp3 dist/SHPH-Queue/voice/ -ErrorAction SilentlyContinue
          Copy-Item tools/make_voice.py dist/SHPH-Queue/voice/
          $n = (Get-ChildItem dist/SHPH-Queue/voice -Filter *.mp3).Count
          Write-Host "voice clips: $n"
          if ($n -eq 0) { Write-Host "::warning::No voice clips were generated; the package will use the browser's Thai voice." }
          Compress-Archive -Path dist/SHPH-Queue -DestinationPath dist/SHPH-Queue-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SHPH-Queue-windows
          path: dist/SHPH-Queue

      # A release comes from a pushed tag vX.Y.Z, or from running this workflow on main with
      # "release" ticked, which creates the tag from Cargo.toml's version.
      - name: Release notes from CHANGELOG
        id: rel
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$cargo_v"; fi
          [ "$v" = "$cargo_v" ] || { echo "::error::tag v$v does not match Cargo.toml version $cargo_v"; exit 1; }
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Release
        if: steps.rel.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/SHPH-Queue-windows.zip
          body_path: release-notes.md
